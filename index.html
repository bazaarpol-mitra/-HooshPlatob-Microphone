<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>میکروفون هوش پلتوب</title>

<style>
*{box-sizing:border-box}

:root{
  --blue:#1769d1;
  --blue-dark:#1055ad;
  --bg:#f4f8ff;
  --text:#17324d;
  --muted:#718096;
  --border:#d9e5f4;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  font-family:Tahoma,Arial,sans-serif;
  color:var(--text);
}

.box{
  width:calc(100% - 32px);
  max-width:400px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:22px;
  padding:26px 20px;
  text-align:center;
  box-shadow:0 10px 30px rgba(23,50,77,.10);
}

.logo{
  font-size:40px;
  margin-bottom:8px;
}

h1{
  margin:0 0 8px;
  font-size:21px;
  color:var(--blue);
}

#status{
  margin:17px 0;
  padding:12px;
  border-radius:13px;
  background:var(--bg);
  border:1px solid var(--border);
  font-size:14px;
  line-height:1.9;
  white-space:pre-line;
}

.mic{
  width:104px;
  height:104px;
  border-radius:50%;
  border:3px solid var(--blue);
  background:#fff;
  color:var(--blue);
  font-size:43px;
  display:block;
  margin:23px auto 17px;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(23,105,209,.15);
}

.mic:hover{
  background:#f4f8ff;
}

.mic.recording{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.05)}
  100%{transform:scale(1)}
}

audio{
  width:100%;
  margin:10px 0 17px;
}

.actions{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
}

button.action{
  min-height:44px;
  border:1px solid var(--blue);
  border-radius:11px;
  padding:10px 15px;
  font-size:14px;
  font-weight:bold;
  background:var(--blue);
  color:#fff;
  cursor:pointer;
}

button.action:hover{
  background:var(--blue-dark);
}

button.cancel{
  background:#fff;
  color:var(--blue);
}

button.cancel:hover{
  background:var(--bg);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.hidden{
  display:none!important;
}

.small{
  font-size:12px;
  color:var(--muted);
  line-height:1.8;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">🎙️</div>

  <h1>میکروفون هوش پلتوب</h1>

  <div id="status">در حال بررسی ارتباط...</div>

  <button
    id="micBtn"
    class="mic"
    onclick="toggleRecording()"
    aria-label="ضبط صدا"
  >🎙️</button>

  <audio
    id="player"
    class="hidden"
    controls
  ></audio>

  <div id="actions" class="actions hidden">

    <button
      class="action"
      onclick="startAgain()"
    >🔄 ضبط مجدد</button>

    <button
      class="action"
      id="sendBtn"
      onclick="sendAudio()"
    >✓ تأیید و ارسال</button>

    <button
      class="action cancel"
      onclick="cancelRecording()"
    >لغو</button>

  </div>

  <div class="small">
    صدای شما فقط برای تبدیل به متن استفاده می‌شود.
  </div>

</div>

<script>

let mediaRecorder=null;
let audioChunks=[];
let audioBlob=null;
let audioUrl=null;
let stream=null;
let recording=false;
let sending=false;

const params=new URLSearchParams(location.search);

const target=
  params.get('target') ||
  params.get('targetId') ||
  '';

const returnOrigin=
  params.get('returnOrigin') ||
  'https://script.google.com';

const statusBox=
  document.getElementById('status');

const micBtn=
  document.getElementById('micBtn');

const player=
  document.getElementById('player');

const actions=
  document.getElementById('actions');

const sendBtn=
  document.getElementById('sendBtn');


function setStatus(text){
  statusBox.textContent=String(text||'');
}


function sendToOpener(message){

  if(!window.opener){
    return false;
  }

  try{

    window.opener.postMessage(
      message,
      returnOrigin || '*'
    );

    return true;

  }catch(error){

    console.error(error);
    return false;

  }
}


function notifyReady(){

  if(!window.opener){
    setStatus(
      '❌ ارتباط با هوش پلتوب برقرار نیست.\n\n' +
      'این صفحه باید از داخل هوش پلتوب باز شود.'
    );
    return;
  }

  setStatus(
    '✅ ارتباط با هوش پلتوب برقرار است.\n\n' +
    'میکروفون آماده است.'
  );

  sendToOpener({
    type:'HOOSHPLATOB_MIC_READY',
    targetId:target,
    target:target
  });

}


/* ارتباط اولیه */
window.addEventListener('load',function(){

  notifyReady();

  /*
   * چند بار ارسال می‌کنیم تا اگر صفحه آکادمی
   * کمی دیرتر آماده شد، ارتباط از دست نرود.
   */
  setTimeout(notifyReady,500);
  setTimeout(notifyReady,1200);

});


async function toggleRecording(){

  if(recording){
    stopRecording();
    return;
  }

  await startRecording();

}


async function startRecording(){

  try{

    if(sending){
      return;
    }

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      setStatus(
        '❌ مرورگر از میکروفون پشتیبانی نمی‌کند.'
      );

      return;
    }

    audioChunks=[];
    audioBlob=null;

    if(audioUrl){

      URL.revokeObjectURL(audioUrl);
      audioUrl=null;

    }

    player.removeAttribute('src');
    player.classList.add('hidden');
    actions.classList.add('hidden');

    setStatus(
      '⏳ در حال فعال‌سازی میکروفون...'
    );

    stream=
      await navigator.mediaDevices.getUserMedia({

        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        }

      });


    let options={};

    if(
      window.MediaRecorder &&
      MediaRecorder.isTypeSupported(
        'audio/webm;codecs=opus'
      )
    ){

      options.mimeType=
        'audio/webm;codecs=opus';

    }else if(
      window.MediaRecorder &&
      MediaRecorder.isTypeSupported('audio/webm')
    ){

      options.mimeType='audio/webm';

    }


    mediaRecorder=
      new MediaRecorder(stream,options);


    mediaRecorder.ondataavailable=function(event){

      if(
        event.data &&
        event.data.size>0
      ){

        audioChunks.push(event.data);

      }

    };


    mediaRecorder.onerror=function(event){

      console.error(
        'MediaRecorder error:',
        event
      );

      setStatus(
        '❌ هنگام ضبط صدا خطایی رخ داد.'
      );

    };


    mediaRecorder.onstop=function(){

      try{

        const mimeType=
          mediaRecorder.mimeType ||
          'audio/webm';

        audioBlob=
          new Blob(
            audioChunks,
            {type:mimeType}
          );

        if(!audioBlob.size){

          setStatus(
            '❌ فایل صوتی خالی است.'
          );

          cleanupStream();
          recording=false;
          return;

        }

        audioUrl=
          URL.createObjectURL(audioBlob);

        player.src=audioUrl;
        player.classList.remove('hidden');

        actions.classList.remove('hidden');
        sendBtn.disabled=false;

        cleanupStream();

        recording=false;

        micBtn.classList.remove('recording');
        micBtn.textContent='🎙️';

        setStatus(
          '✅ ضبط انجام شد.\n\n' +
          'صدایت را بررسی کن و «تأیید و ارسال» را بزن.'
        );

      }catch(error){

        console.error(error);

        cleanupStream();

        recording=false;

        micBtn.classList.remove('recording');
        micBtn.textContent='🎙️';

        setStatus(
          '❌ پردازش فایل صوتی انجام نشد.'
        );

      }

    };


    mediaRecorder.start(250);

    recording=true;

    micBtn.classList.add('recording');
    micBtn.textContent='⏹️';

    setStatus(
      '🔴 در حال ضبط...\n\n' +
      'برای توقف دوباره دکمه را بزن.'
    );

  }catch(error){

    console.error(error);

    cleanupStream();

    recording=false;

    micBtn.classList.remove('recording');
    micBtn.textContent='🎙️';

    if(error.name==='NotAllowedError'){

      setStatus(
        '❌ اجازه دسترسی به میکروفون داده نشد.'
      );

    }else if(error.name==='NotFoundError'){

      setStatus(
        '❌ میکروفون پیدا نشد.'
      );

    }else if(error.name==='NotReadableError'){

      setStatus(
        '❌ میکروفون توسط برنامه دیگری در حال استفاده است.'
      );

    }else{

      setStatus(
        '❌ خطای میکروفون:\n' +
        (error.message || error)
      );

    }

  }

}


function stopRecording(){

  if(
    mediaRecorder &&
    mediaRecorder.state!=='inactive'
  ){

    mediaRecorder.stop();

  }

}


function cleanupStream(){

  if(stream){

    stream
      .getTracks()
      .forEach(function(track){

        try{
          track.stop();
        }catch(e){}

      });

    stream=null;

  }

}


function startAgain(){

  if(recording){
    stopRecording();
  }

  if(audioUrl){

    URL.revokeObjectURL(audioUrl);
    audioUrl=null;

  }

  audioBlob=null;
  audioChunks=[];

  player.removeAttribute('src');
  player.classList.add('hidden');

  actions.classList.add('hidden');

  sendBtn.disabled=false;

  setTimeout(function(){
    startRecording();
  },150);

}


function cancelRecording(){

  sending=false;

  if(
    mediaRecorder &&
    mediaRecorder.state!=='inactive'
  ){

    try{
      mediaRecorder.stop();
    }catch(e){}

  }

  cleanupStream();

  audioChunks=[];
  audioBlob=null;

  if(audioUrl){

    URL.revokeObjectURL(audioUrl);
    audioUrl=null;

  }

  player.removeAttribute('src');
  player.classList.add('hidden');

  actions.classList.add('hidden');

  recording=false;

  micBtn.classList.remove('recording');
  micBtn.textContent='🎙️';

  sendToOpener({
    type:'HOOSHPLATOB_MIC_CANCEL',
    targetId:target,
    target:target
  });

  setStatus('ضبط لغو شد.');

}


function sendAudio(){

  if(sending){
    return;
  }

  if(!audioBlob || !audioBlob.size){

    setStatus(
      '❌ صدایی برای ارسال وجود ندارد.'
    );

    return;
  }

  if(!window.opener){

    setStatus(
      '❌ ارتباط با هوش پلتوب برقرار نیست.'
    );

    return;
  }

  sending=true;
  sendBtn.disabled=true;

  setStatus(
    '⏳ در حال ارسال صدا به هوش پلتوب...'
  );


  const reader=
    new FileReader();


  reader.onerror=function(){

    sending=false;
    sendBtn.disabled=false;

    setStatus(
      '❌ خواندن فایل صوتی انجام نشد.'
    );

  };


  reader.onloadend=function(){

    try{

      const result=
        reader.result || '';

      const parts=
        result.split(',');

      const base64=
        parts.length>1
          ? parts[1]
          : '';

      if(!base64){

        sending=false;
        sendBtn.disabled=false;

        setStatus(
          '❌ تبدیل فایل صوتی انجام نشد.'
        );

        return;
      }


      const mimeType=
        audioBlob.type ||
        'audio/webm';


      const ok=
        sendToOpener({

          type:'HOOSHPLATOB_AUDIO',

          targetId:target,
          target:target,

          base64:base64,
          audioBase64:base64,

          mimeType:mimeType,
          mime:mimeType

        });


      if(!ok){

        sending=false;
        sendBtn.disabled=false;

        setStatus(
          '❌ ارسال به هوش پلتوب انجام نشد.'
        );

        return;
      }


      setStatus(
        '✅ صدا با موفقیت ارسال شد.\n\n' +
        'در حال تبدیل صدا به متن...'
      );


      setTimeout(function(){

        try{
          window.close();
        }catch(e){}

      },900);


    }catch(error){

      console.error(error);

      sending=false;
      sendBtn.disabled=false;

      setStatus(
        '❌ خطا در ارسال صدا:\n' +
        (error.message || error)
      );

    }

  };


  reader.readAsDataURL(audioBlob);

}


window.addEventListener(
  'beforeunload',
  function(){

    cleanupStream();

    if(audioUrl){

      try{
        URL.revokeObjectURL(audioUrl);
      }catch(e){}

    }

  }
);

</script>

</body>
</html>
